[project]
name = "openplan-api"
version = "0.1.0"
description = "OpenPlan API Azure Functions application"
requires-python = "==3.14.*"
dependencies = [
  "azure-functions",
  "azure-functions-openapi",
  "azure-identity",
  "azure-storage-blob",
  "packaging>=26.3",
  "polars",
  "pydantic>=2.7,<3",
]

[dependency-groups]
dev = [
  "coverage>=7.14.2",
  "isort>=9.0.2",
  "pip>=26.2.2",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-mock>=3.10",
  "ruff>=0.15.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openplan"]
