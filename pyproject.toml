[project]
name = "openplan-api"
version = "0.1.0"
description = "OpenPlan API Azure Functions application"
requires-python = "==3.14.*"
dependencies = [
  "azure-functions",
  "fastapi",
  "azure-identity",
  "azure-storage-blob",
  "packaging>=26.3",
  "polars",
  "pydantic>=2.7,<3",
  "pip",
]

[dependency-groups]
dev = [
  "httpx2",
  "pytest",
  "polars",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
